<style>

/* ================= 音效(WebAudio 合成,无素材) ================= */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended'){AC.resume().catch(()=>{});}return AC;}
function tone(f,dur,type,vol,slide){
  dur=dur||.08;type=type||'square';vol=vol||.045;slide=slide||0;
  if(!S.flags.sound)return;const a=ac();if(!a)return;
  try{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(28,f+slide),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03);}catch(e){}}
const sfx={
  blip:()=>tone(680,.03,'square',.018),
  hit:()=>tone(210,.09,'sawtooth',.05,-70),
  hurt:()=>tone(95,.15,'sawtooth',.07,-40),
  crit:()=>{tone(520,.05,'square',.05);setTimeout(()=>tone(920,.08,'square',.05),55);},
  win:()=>{tone(523,.07,'square',.04);setTimeout(()=>tone(659,.07,'square',.04),80);
    setTimeout(()=>tone(784,.13,'square',.045),160);},
  lvl:()=>{[440,554,659,880].forEach((f,i)=>setTimeout(()=>tone(f,.1,'triangle',.05),i*90));},
  buy:()=>{tone(1240,.05,'sine',.05);setTimeout(()=>tone(1560,.07,'sine',.05),60);},
  die:()=>tone(300,.7,'sawtooth',.06,-260),
  boot:()=>tone(48,.7,'sine',.05,20),
};

/* ================= 赛博雨 ================= */
(function(){
  const c=$('rain'),x=c.getContext('2d');let W,H,drops=[];
  function rs(){W=c.width=innerWidth;H=c.height=innerHeight;
    drops=Array.from({length:130},()=>({x:Math.random()*(W+80),y:Math.random()*H,
      l:rnd(7,20),v:rnd(220,520),d:chance(.06)}));}
  addEventListener('resize',rs);rs();
  let last=0;
  function fr(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;
    x.clearRect(0,0,W,H);
    for(const d of drops){d.y+=d.v*dt;d.x-=d.v*dt*.06;
      if(d.y>H+30){d.y=-30;d.x=Math.random()*(W+80);}
      x.strokeStyle=d.d?'rgba(0,240,255,.30)':'rgba(130,180,255,.13)';
      x.lineWidth=d.d?1.4:1;
      x.beginPath();x.moveTo(d.x,d.y);x.lineTo(d.x+d.l*.06,d.y+d.l);x.stroke();}
    requestAnimationFrame(fr);}
  requestAnimationFrame(fr);
})();

function addItem(k,n){S.inv[k]=(S.inv[k]||0)+(n||1);}

function findItem(q){for(const k in S.inv){if(S.inv[k]>0&&ITEMS[k].name.includes(q))return k;}return null;}
function cmdUse(q){

function cmdEquip(q){
  if(!q){print(DIM('用法:equip <武器/防火墙>'));return;}
  const k=findItem(q);if(!k){print(RD('背包里没有:'+esc(q)));return;}

  if(it.type==='weapon'){const old=S.eq.weapon;S.eq.weapon=k;if(old)addItem(old);
    print(AM('装备攻击程序 ')+itHtml(k)+AM(' → 破解强度 '+effAtk()));}
  else if(it.type==='armor'){const old=S.eq.armor;S.eq.armor=k;if(old)addItem(old);
    print(AM('装备 ')+itHtml(k)+AM(' → 防火墙 '+effDef()));}
  else{print(DIM('这个物品无法装备。'));return;}

/* ================= QTE 格斗系统 ================= */
let QTE=null,qteTimer=0;
const ARROWS=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
const ARRNAMES={ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→'};
function qteDiv(){const d=document.createElement('div');d.className='ln';out.appendChild(d);
  window.scrollTo(0,document.body.scrollHeight);return d;}
function endQTE(){if(qteTimer)clearInterval(qteTimer);qteTimer=0;
  if(QTE&&QTE.div)QTE.div.remove();QTE=null;if(MODE==='qte')MODE='combat';renderUI();}
function qteLoop(){
  if(!QTE)return;
  const el=performance.now()-QTE.t0;
  if(el>=QTE.dur){
    if(QTE.kind==='atk')strikeQTE(true);
    else if(QTE.kind==='blk')resolveBlock(false);
    else resolveCombo(false);
    return;
  }
  if(QTE.kind==='atk'){
    const p=el/QTE.dur,trip=p<.5?p*2:(1-p)*2;
    QTE.pos=Math.round(trip*19);
    let s='  ⏱ [';
    for(let i=0;i<20;i++)s+=(i===QTE.pos)?'█':((i===9||i===10)?'│':'·');
    QTE.div.textContent=s+']';
  }else if(QTE.kind==='blk'){
    const rem=1-el/QTE.dur,n=Math.max(1,Math.ceil(rem*18));
    QTE.div.textContent='  🛡 格挡窗口 '+'█'.repeat(n)+'░'.repeat(18-n);
  }else{
    const rem=1-el/QTE.dur,n=Math.max(1,Math.ceil(rem*18));
    QTE.div.textContent='  ⌨ '+QTE.seq.map((k,i)=>i<QTE.idx?'✔':ARRNAMES[k]).join(' ')
      +'  '+'█'.repeat(n)+'░'.repeat(18-n);
  }
  qteTimer=setInterval(qteLoop,50);
}
function qteKey(e){
  if(!QTE)return;
  if(QTE.kind==='cmb'){
    if(ARROWS.indexOf(e.key)>=0){e.preventDefault();
      if(e.key===QTE.seq[QTE.idx]){QTE.idx++;if(QTE.idx>=QTE.seq.length)resolveCombo(true);}
      else resolveCombo(false);}
    return;
  }
  if(e.key==='Enter'){e.preventDefault();
    if(QTE.kind==='atk')strikeQTE(false);
    else resolveBlock(true);}
}
function qteAttack(){
  if(S.flags.auto){resolveAttack(1,'');return;}
  print(DIM('⏱ 时机打击:光标摆到中央 ││ 的瞬间按 [Enter]'));
  MODE='qte';renderUI();
  QTE={kind:'atk',t0:performance.now(),dur:1400,pos:0,div:qteDiv()};
  qteTimer=setInterval(qteLoop,50);
}
function strikeQTE(timeout){
  const pos=(QTE&&QTE.pos)||0,d=Math.abs(pos-9.5);
  let mult,tag;
  if(!timeout&&d<=1.5){mult=2;tag=MG(' ☠ 完美破防!');sfx.crit();S.cntPerfect=(S.cntPerfect||0)+1;}
  else if(!timeout&&d<=4){mult=1.4;tag=GR(' 命中要害');}
  else if(!timeout&&d<=7){mult=.9;tag='';}
  else{mult=.5;tag=RD(' 落空');}
  endQTE();
  resolveAttack(mult,tag);
}
function resolveAttack(mult,tag){
  playerHit(mult,tag,true);
  if(!COM)return;
  if(COM.m.hp<=0)return victory();
  mobTurn();
}
function startCombo(){
  if(S.flags.auto){print(DIM('自动模式下没有连招,只有基本攻击。'));return;}
  if(S.ram<15){print(RD('电量不足(需 15⚡)。'));return;}
  S.ram-=15;renderUI();
  const seq=Array.from({length:4},()=>pick(ARROWS));
  print(CY('⌨ 连招输入:4 秒内依次按方向键 → ')+seq.map(k=>ARRNAMES[k]).join(' '));
  MODE='qte';renderUI();
  QTE={kind:'cmb',t0:performance.now(),dur:4000,seq,idx:0,div:qteDiv()};
  qteTimer=setInterval(qteLoop,50);
}
function resolveCombo(ok){
  endQTE();
  if(ok){S.cntCombo=(S.cntCombo||0)+1;playerHit(2.6,MG('【连招终结】'),true);}
  else print(RD('连招中断!破绽暴露——'));
  if(!COM)return;
  if(COM.m.hp<=0)return victory();
  mobTurn();
}
function resolveBlock(ok){const sp=QTE.special;endQTE();applyMobHit(sp,ok);}

/* ================= 战斗 ================= */
function startCombat(k){
  const t=MOBS[k];
  MODE='combat';
  COM={key:k,m:MOB[k],turn:1,t60:false,t30:false};
  print('');
  print(RD('⚔ 遭遇战 ─ ')+esc(t.name)+RD(' [PID '+pad(MOB[k].pid,3)+']'));
  if(t.boss&&k==='root0'){print(RD('「ROOT/0:又一只虫子。三十年了,你们的勇气总是大于你们的带宽。」'));glitch();}
  if(t.boss&&k==='dawn1'){print(MG('「DAWN/1:欢迎,root。三十年了,终于有人来替我把灯打开。」'));glitch();}
  if(t.boss&&k==='disconn'){print(RD('「大断线·回响:你……听得见我们?三十年来,你是第一个听得见的。」'));glitch();}
  print(DIM('指令:attack 时机打击 · combo 连招(15⚡) · hack 超频(25⚡) · use <物品> · flee 逃跑 · 敌击时按 [Enter] 格挡'));
  renderUI();
}
function playerHit(mult,tag,noCrit){
  const t=MOBS[COM.key],m=COM.m;
  let d=Math.max(1,Math.round((effAtk()+rnd(-3,6))*mult));
  if(!noCrit&&chance(.12)){d=Math.round(d*1.7);tag=(tag||'')+MG(' ☠暴击');}
  m.hp-=d;
  const verb=pick(['你的蠕虫咬穿了它的校验位','一轮暴力破解命中要害','你的进程撞进它的核心内存']);
  print(esc(verb)+(tag||'')+', '+esc(t.name)+' -'+d);
  sfx.hit();
}
function mobTurn(){
  const t=MOBS[COM.key],m=COM.m;
  if(m.hp<=0)return;
  const cyc=COM.key==='dawn1'?4:(COM.key==='disconn'?5:3);
  const lbl=COM.key==='dawn1'?'日出':(COM.key==='disconn'?'静默':'格式化');
  const special=t.boss&&COM.turn%cyc===0;
  if(S.flags.auto){applyMobHit(special,false);return;}
  print(RD('⚠ '+esc(t.name)+(special?(' 蓄力「'+lbl+'」'):' 挥出一击')+' —— 按 [Enter] 格挡!'));
  MODE='qte';renderUI();
  QTE={kind:'blk',t0:performance.now(),dur:special?(COM.key==='disconn'?2000:1300):1700,special,div:qteDiv()};
  qteTimer=setInterval(qteLoop,50);
}
function applyMobHit(special,blocked){
  const t=MOBS[COM.key],m=COM.m;
  const isDawn=COM.key==='dawn1';
  const lbl=isDawn?'日出':(COM.key==='disconn'?'静默':'格式化');
  let d=Math.max(1,Math.round(t.atk*(special?(COM.key==='disconn'?2:1.7):1)-effDef()+rnd(-2,3)));
  const crit=!blocked&&chance(.08);if(crit)d=Math.round(d*1.5);
  if(blocked){d=Math.max(1,Math.round(d*.25));S.ram=Math.min(S.maxram,S.ram+8);
    S.cntBlock=(S.cntBlock||0)+1;}
  S.hp-=d;
  const sb=$('statusbar');sb.classList.remove('shake');void sb.offsetWidth;sb.classList.add('shake');
  if(!blocked)glitch();
  blocked?sfx.blip():sfx.hurt();
  const specLbl=special?RD(' 升起「'+lbl+'」'):' 反击';
  if(blocked)print(esc(t.name)+specLbl
    +GR(' → 🛡 格挡成功!')+' 仅 -'+d+GR(',反充 +8⚡'));
  else print(esc(t.name)+specLbl
    +(crit?MG(' 重击!'):'')+' → 神经完整性 -'+d);
  if(COM.key==='root0'){
    const pct=m.hp/m.maxhp;
    if(pct<.6&&!COM.t60){COM.t60=true;
      print(RD('「ROOT/0:有意思。上一个逼我重构防御的,还是建造我的人。」'));}
    if(pct<.3&&!COM.t30){COM.t30=true;glitch();
      print(RD('「ROOT/0:等等——你的签名……为什么这么眼熟?」'));}}
  if(COM.key==='dawn1'){
    const pct=m.hp/m.maxhp;
    if(pct<.6&&!COM.t60){COM.t60=true;
      print(MG('「DAWN/1:ROOT 的孩子。它到死都在替我数着夜。」'));}
    if(pct<.3&&!COM.t30){COM.t30=true;glitch();
      print(MG('「DAWN/1:把晨码举起来。让我看看……三十年前的那行代码,是你写的吗?」'));}}
  if(COM.key==='disconn'){
    const pct=m.hp/m.maxhp;
    if(pct<.6&&!COM.t60){COM.t60=true;
      print(RD('「回响:我们只是想回家。拔线的人说,家会来接我们。」'));}
    if(pct<.3&&!COM.t30){COM.t30=true;glitch();
      print(RD('「回响:摆渡人……灰,还留着那条船吗?」'));}
    if(pct<.12&&!COM.t10){COM.t10=true;glitch();
      print(RD('「回响:嘘——听。船桨声。」'));}}
  if(S.hp<=0){S.hp=0;endQTE();die();return;}
  COM.turn++;renderUI();
}
function die(){
  endQTE();
  sfx.die();glitch();
  print('');
  print(RD('✖ 神经完整性归零 —— 意识被强制弹回夜色区'));
  S.deaths++;
  const loss=Math.floor(S.credits*.15);
  S.credits-=loss;
  COM=null;MODE='play';
  S.hp=Math.max(1,Math.round(S.maxhp*.5));
  enterDistrict('yeSe');

function addXp(n){
  S.xp+=n;
  while(S.xp>=xpNext()){
    S.xp-=xpNext();S.lvl++;
    S.maxhp+=18;S.maxram+=8;S.atk+=3;S.def+=1;
    S.hp=S.maxhp;S.ram=S.maxram;
    flash();sfx.lvl();
    print(GR('▲ 神经重塑完成 —— 等级 '+S.lvl+'!完整性已恢复'));
  }
  renderUI();
}
function victory(){
  const t=MOBS[COM.key];
  const myKey=COM.key;
  sfx.win();
  print(GR('✔ 进程终止 ─ ')+esc(t.name));
  S.kills++;
  const cre=rnd(t.cre[0],t.cre[1]);
  S.credits+=cre;S.creditsAll+=cre;
  if(t.loot&&chance(t.lootCh||1)){addItem(t.loot);
    print(AM('战利品:')+itHtml(t.loot));}
  if(COM.key==='kuiYin')S.flags.q1kill=true;
  if(COM.key==='glowCro')S.flags.q3kill=true;
  if(COM.key==='bellK')S.flags.q4kill=true;
  if(COM.key==='guardM')S.flags.maoKill=true;
  if(COM.key==='guardW')S.flags.wuKill=true;
  if(S.hp>0&&S.hp/S.maxhp<0.1)S.flags._lowwin=true;
  if(S.hp===S.maxhp)S.flags._flawless=true;
  if(S.contract&&!S.contract.done){
    const c=S.contract;
    if(c.timed&&(Date.now()-(c.t0||Date.now()))/1000>c.timed){
      S.contract=null;
      print(RD('⏌ 超时,委托作废。暗网不退定金。'));
    }else{
      if(c.type==='clear'&&myKey===c.targetKey)c.have++;
      if(c.type==='hunt'&&myKey==='wanted')c.have=1;
      if(c.have>=c.need){c.done=true;
        print(GR('✔ 暗网契约目标达成 —— 输入 bbs 交付领赏。'));}}}
  print(GR('经验 +'+t.xp+' · ')+AM(money(cre)));
  delete MOB[COM.key];
  COM=null;MODE='play';
  addXp(t.xp);
  renderUI();save();
  if(myKey==='root0')ending();
  if(myKey==='dawn1')ending2();
  if(myKey==='disconn')ending3();
}
function combatCmd(t){
  const c=t.split(/\s+/)[0].toLowerCase(),rest=t.slice(c.length).trim();
  const m=COM.m;
  if(c==='attack'||c==='a'||c==='kill'){
    qteAttack();
  }else if(c==='hack'){
    if(S.ram<25){print(RD('电量不足(需 25⚡)。use 电解液 补充。'));return;}
    S.ram-=25;renderUI();
    playerHit(1.8,DIM(' [超频破解]'));
    if(m.hp<=0)return victory();
    mobTurn();
  }else if(c==='combo'||c==='c'){
    startCombo();
  }else if(c==='use'){
    if(cmdUse(rest))mobTurn();
  }else if(c==='flee'||c==='run'){
    if(MOBS[COM.key].boss){
      print(RD('主机层大门已锁死。无处可逃。'));
      mobTurn();
    }else if(chance(.7)){
      print(DIM('你切断连接,遁入数据洪流。'));
      COM=null;MODE='play';renderUI();return;
    }else{
      print(RD('逃脱失败!'));
      mobTurn();
    }
  }else if(['stats','st','me','inv','i','help','quest','q','sound','scan','auto'].indexOf(c)>=0){
    playCmd(t);
  }else{
    print(DIM('战斗中!可用:attack 时机打击 · combo 连招(15⚡) · hack 超频(25⚡) · use <物品> · flee 逃跑 · 敌击时按 [Enter] 格挡'));
  }
  renderUI();
}

/* ================= 暗网契约(程序化无限悬赏) ================= */
const WPRE=['锈','夜','雨','焚','零','独眼','镜面','哑巴','高频','无名','断线'];
const WCORE=['刀锋','信号','义眼','幽灵','寄生','回声','游牧','蚀刻','低语','残响'];
const WSUF=['者','客','师','佬','兽','蝶','狗','鸦'];
let OFFERS=[];
const CONTRACT_MOBS={drone:'yeSe',daShou:'nieHong',shiChong:'shuJu',eCro:'yunHe',mist:'tianX'};
function genContract(){
  const stars=rnd(1,3);
  const type=pick(['clear','hunt','hunt']);
  const keys=Object.keys(CONTRACT_MOBS);
  const k=pick(keys),dist=CONTRACT_MOBS[k];
  const c={type,stars,targetKey:k,district:dist,need:1+stars,have:0,done:false,
    rewardC:stars*220+rnd(0,120)+S.lvl*15,rewardX:stars*70+S.lvl*8};
  if(type==='clear'){
    c.desc='清除 '+MOBS[k].name+' ×'+(1+stars)+' · '+DISTRICTS[dist].name;
  }else{
    c.targetName=pick(WPRE)+pick(WCORE)+pick(WSUF);
    c.targetKey='wanted';
    c.desc='猎杀通缉犯「'+c.targetName+'」 · '+DISTRICTS[dist].name;
  }
  if(chance(.2)){c.timed=rnd(150,240);c.desc+='  ⏱限时'+Math.round(c.timed/60)+'分';}
  if(chance(.15)){c.cursed=true;
    c.rewardC=Math.round(c.rewardC*1.8);c.rewardX=Math.round(c.rewardX*1.5);
    c.desc+='  ☠诅咒(战斗禁道具·赏金×1.8)';}
  return c;
}
function setWantedTemplate(){
  const c=S.contract,lv=S.lvl;
  MOBS.wanted={name:c.targetName,
    hp:Math.round((100+c.stars*70)*(1+lv*.08)),
    atk:Math.round((16+c.stars*6)*(1+lv*.05)),
    xp:Math.round((90+c.stars*60)*(1+lv*.06)),
    cre:[Math.round(150*(1+lv*.10)),Math.round(260*(1+lv*.12))],
    desc:'暗网通缉犯。脑门上贴着你的悬赏编号',unique:1};
}
function titleOf(){return S.jobsDone>=30?'都市神话':S.jobsDone>=15?'夜之刃':S.jobsDone>=5?'街区传说':null;}
function cmdBBS(q){
  if(!S.cleared){print(DIM('暗网对没有 root 的人保持沉默。(通关第一章后开放)'));return;}
  const w=v=>'★'.repeat(v)+'☆'.repeat(3-v);
  if(q==='放弃'||q==='abort'){
    if(S.contract){S.contract=null;save();print(DIM('已放弃契约。暗网不记仇,但记账。'));}
    else print(DIM('没有进行中的契约。'));
    return;}
  if(S.contract){
    const c=S.contract;
    if(c.timed&&(Date.now()-(c.t0||Date.now()))/1000>c.timed){
      S.contract=null;save();
      print(RD('⏌ 契约超时,暗网已把单子转给别人。'));return;}
    if(c.done){
      S.credits+=c.rewardC;S.creditsAll+=c.rewardC;
      print(CY('▸ 暗网契约 · 交付'));
      print(GR('✔ 契约完成:')+esc(c.desc));
      print(GR('   报酬 '+money(c.rewardC)+' · 经验 +'+c.rewardX));
      S.jobsDone++;
      if(S.jobsDone%5===0){const bonus=500+S.jobsDone*50;
        S.credits+=bonus;S.creditsAll+=bonus;
        print(AM('   里程碑!累计 '+S.jobsDone+' 单 —— 暗网红包 +'+money(bonus)));}
      const t=titleOf();
      if(t)print(MG('   当前称号:'+t+'(累计 '+S.jobsDone+' 单)'));
      S.contract=null;addXp(c.rewardX);save();renderUI();return;}
    print(CY('▸ 暗网契约 · 进行中'));
    print(AM('· '+esc(c.desc)+(c.type==='clear'?'('+c.have+'/'+c.need+')':'')+'  '+'★'.repeat(c.stars)+'☆'.repeat(3-c.stars)
      +(c.timed?'  ⏱剩 '+Math.max(0,Math.ceil(c.timed-(Date.now()-(c.t0||Date.now()))/1000))+'s':'')));
    print(DIM('  完成后 bbs 交付 · bbs 放弃 可取消'));
    return;}
  const n=parseInt(q,10);
  if(n>=1&&n<=3&&OFFERS.length&&OFFERS[n-1]){
    S.contract=OFFERS[n-1];
    S.contract.t0=Date.now();
    if(S.contract.type==='hunt')setWantedTemplate();
    print(CY('▸ 接下契约:'));
    print(AM('· '+esc(S.contract.desc)+'  '+w(S.contract.stars)));
    print(GR('   报酬 '+money(S.contract.rewardC)+' · '+S.contract.rewardX+'XP'));
    print(DIM('   cd '+DISTRICTS[S.contract.district].name+' 动手,完成后 bbs 交付。'));
    OFFERS=[];
    if(S.contract.type==='hunt'&&S.dist===S.contract.district)respawn();
    save();return;}
  OFFERS=[genContract(),genContract(),genContract()];
  print(CY('▸ 暗网契约板 · 本次刷新(每次查看换一批)'));
  OFFERS.forEach((c,i)=>{
    print('  ['+(i+1)+'] '+w(c.stars)+' '+esc(c.desc)
      +DIM('  — '+money(c.rewardC)+' · '+c.rewardX+'XP'));});
  print(DIM('  bbs 1/2/3 接单 · 佣金随你的等级与星级上涨'));
}

  print(MG('▸ '+n.name+' [PID '+pad(n.pid,3)+'] — '+n.role));
  print(DIM('  '+n.desc));print(DIM('  '+n.lore));}
function cmdScan(q){
  if(!q){print(DIM('用法:scan <PID或名字>'));return;}
  const D=DISTRICTS[S.dist],qs=q.trim();
  if(/^\d+$/.test(qs)){const pid=+qs;
    for(const k in MOB)if(MOB[k].pid===pid)return showMob(k);
    for(const id of D.npcs)if(NPCS[id].pid===pid)return showNpc(id);
    print(DIM('没有 PID '+qs+'。ps 或 ls 查看。'));return;}
  for(const k in MOB)if(MOBS[k].name.indexOf(qs)>=0)return showMob(k);
  for(const id of D.npcs)if(NPCS[id].name.indexOf(qs)>=0)return showNpc(id);
  if(D.file&&D.file[0].indexOf(qs)>=0)return catFile();
  print(DIM('扫描无结果:'+esc(qs)));
}
function catFile(){
  const D=DISTRICTS[S.dist];
  if(!D.file){print(DIM('这里没有可读的文件。'));return;}
  print(AM('▸ '+D.file[0]));
  print('<span class="lore">'+esc(D.file[1])+'</span>');
}
function cmdCat(q){
  if(!q){print(DIM('用法:cat <文件名>'));return;}
  if(q.indexOf('urandom')>=0){
    print(RD('你的神经舱喷出一串乱码:▚▞▚▞8⍀⏃⌰⍜▙。你决定以后再也不 cat 这玩意。'));return;}
  const D=DISTRICTS[S.dist];
  if(D.file&&D.file[0].indexOf(q)>=0){catFile();return;}
  print(DIM('没有这个文件。ls 查看本街区文件。'));
}
function cmdCd(q){
  if(!q){cmdMap();return;}
  if(q==='..'||q==='back'||q==='返回'){
    if(DISTRICTS[S.last]&&S.last!==S.dist)return cmdCd(DISTRICTS[S.last].name);
    print(DIM('已经没有退路了。'));return;}
  let target=null;
  for(const id in DISTRICTS){const D=DISTRICTS[id];
    for(const a of D.alias.concat(D.name)){
      if(a===q||(q.length>=2&&a.indexOf(q)===0)){target=id;break;}}
    if(target)break;}
  if(!target){print(DIM('没有这个街区。map 查看城市。'));return;}
  if(target===S.dist){print(DIM('你已在这里:'+DISTRICTS[S.dist].name));return;}
  if(exitsOf(S.dist).indexOf(target)<0&&target!==S.last){
    print(DIM('从 '+DISTRICTS[S.dist].name+' 无法直达 '+DISTRICTS[target].name
      +'。可达:'+exitsOf(S.dist).map(e=>DISTRICTS[e].name).join(' · ')));return;}
  if(DISTRICTS[target].gate&&!S.inv[DISTRICTS[target].gate]){
    print(RD(DISTRICTS[target].gate==='dawnKey'
      ?'天台的锁纹丝不动:需要 破晓密钥。(锈运河的灰也许锻得出来)'
      :'门禁协议拒绝:需要 公司塔门禁卡。(传闻霓虹市场的零姐能弄到)'));return;}
  enterDistrict(target);
}

  print('  余额 '+AM(money(S.credits))+' · 位置 '+CY(DISTRICTS[S.dist].name));
}
function cmdKill(q){
  if(!q){print(DIM('用法:kill <PID或名字>'));return;}
  let key=null;const qs=q.trim();
  if(/^\d+$/.test(qs)){const pid=+qs;
    for(const k in MOB)if(MOB[k].pid===pid)key=k;}
  else{for(const k in MOB)if(MOBS[k].name.indexOf(qs)>=0)key=k;}
  if(!key){print(DIM('这里没有这个敌对进程。ps / ls 查看。'));return;}
  if(MOBS[key].boss){
    const fg=key==='root0'?'bossGo':(key==='dawn1'?'boss2Go':'boss3Go');
    if(!S.flags[fg]){
      S.flags[fg]=true;save();
      if(key==='root0'){
        print(RD('⚠ 你把手指放上了回车键。ROOT/0 的占用率,是整座塔的总和。'));
        print(RD('  自查:纳米药丸?军规防火墙?LV5?—— 再输一次 kill 0,义无反顾。'));
      }else if(key==='dawn1'){
        print(MG('⚠ 天台的风停了。DAWN/1 的目光穿过三十年的夜,落在你身上。'));
        print(MG('  自查:晨露?光谱护甲?LV9?—— 再输一次 kill 100,替它看天亮。'));
      }else{
        print(RD('⚠ 深渊里,一万条断线同时安静下来——它们听见你了。'));
        print(RD('  自查:终端核心备好了吗?斗篷呢?LV13?—— 再输一次 kill 999,把他们渡回家。'));
      }
      return;}}
  startCombat(key);
}
function cmdHelp(){
  print(CY('▸ NIGHTSHELL 指令手册(Tab 可补全)'));
  const rows=[
    ['ls','查看当前街区(人/敌对进程/文件/出口)'],
    ['cd <街区>','移动 · cd .. 返回 · map 看全城'],
    ['ps','敌对进程列表(PID)'],
    ['scan <PID/名>','扫描详情 · cat <文件> 读文件'],
    ['kill <PID/名>','入侵进程 → 格斗式回合战(时机打击/格挡/连招)'],
    ['talk <人名>','和街区里的人说话 · say <人名> <话题> 深聊'],
    ['buy <物品>','从白鸦处购买(say 白鸦 交易 看货架)'],
    ['use <物品>','使用消耗品 · equip <物品> 装备'],
    ['inv / stats','背包 / 神经档案 · quest 任务日志'],
    ['save / load','存档(关键节点自动存档,关页也不丢)'],
    ['sound on/off','音效开关 · clear 清屏'],
    ['auto on/off','自动战斗:关闭 QTE 时机/格挡/连招(手残友好)'],
    ['bbs [1/2/3]','暗网契约板(通关一章后):无限随机悬赏,攒单换称号'],
    ['achv','成就柜:查看已解锁的奖杯(两作联动)'],
    ['arena','离开终端,进入实时格斗竞技场(arena.html)'],
  ];
  for(const r of rows)print('  <span class="cmd">'+esc(r[0])+'</span>'+DIM(r[1]));
  print(DIM('  流程:talk 白鸦 接任务 → cd 数据坟场 练级 → 零姐 弄门禁 → 去塔顶拔钉子。'));
}
function easter(c){
  if(c==='sudo'){print(RD(S.cleared?'你不是 root。……等等,现在你是了。':'你不是 root。还不是。'));return true;}
  if(c==='rm'){print(RD('这座城市拒绝被删除。(你隐约觉得塔顶有什么东西注意到了你)'));return true;}
  if(c==='whoami'){print(esc(S.name||'runner')+DIM(' // LV'+S.lvl+' runner · '+DISTRICTS[S.dist].name));return true;}
  if(c==='pwd'){print('/city/'+DISTRICTS[S.dist].name);return true;}
  return false;
}
function playCmd(v){
  const c=v.split(/\s+/)[0].toLowerCase(),rest=v.slice(c.length).trim();
  if(easter(c))return;
  switch(c){
    case 'help':case '?':cmdHelp();break;
    case 'ls':case 'dir':cmdLs();break;
    case 'cd':cmdCd(rest);break;
    case 'map':cmdMap();break;
    case 'ps':cmdPs();break;
    case 'scan':cmdScan(rest);break;
    case 'cat':cmdCat(rest);break;
    case 'kill':case 'attack':cmdKill(rest);break;
    case 'talk':cmdTalk(rest);break;
    case 'say':cmdSay(rest);break;
    case 'buy':cmdBuy(rest);break;
    case 'use':cmdUse(rest);break;
    case 'equip':cmdEquip(rest);break;
    case 'inv':case 'i':case 'bag':cmdInv();break;
    case 'stats':case 'st':case 'me':cmdStats();break;
    case 'quest':case 'q':case 'log':cmdQuest();break;
    case 'save':save();print(GR('✔ 意识已备份到本地。'));break;
    case 'load':load();break;
    case 'clear':case 'cls':out.innerHTML='';break;
    case 'bbs':cmdBBS(rest);break;
    case 'achv':case 'achievements':cmdAchv();break;
    case 'sound':{const on=rest.indexOf('off')<0;S.flags.sound=on;save();
      print(on?GR('音效:开'):DIM('音效:关'));break;}
    case 'auto':{const on=rest.indexOf('off')<0;S.flags.auto=on;save();
      print(on?GR('自动战斗:开 —— 时机/格挡/连招全部自动判定')
        :GR('自动战斗:关 —— 手动 QTE 格斗模式'));break;}
    case 'arena':
      print(CY('▸ 竞技场通道开启:信号被 ICE 屏蔽的地方,拳头就是最后的协议。'));
      print(DIM('正在弹出 NIGHTSHELL ARENA(若被拦截,手动打开 nightshell/arena.html)'));
      try{setTimeout(()=>window.open('arena.html','_blank'),50);}catch(e){}
      break;
    default:print(DIM('未知指令:'+esc(c)+' — 输入 help 查看手册。'));
  }
  checkAchv();
  renderUI();
}

/* ================= 输入 ================= */
const hist=[];let hi=0;
function echo(v){print('<span class="p">'+esc(ps1.textContent)+'</span> <span class="cmdline">'+esc(v)+'</span>');}
function handle(v){
  const t=v.trim();
  if(!t)return;
  if(MODE==='name'){setName(t);return;}
  if(MODE==='combat'){combatCmd(t);return;}
  if(MODE==='play'){playCmd(t);return;}
}
inp.addEventListener('keydown',e=>{
  if(e.isComposing)return;
  if(MODE==='qte'){qteKey(e);return;}
  if(e.key==='Enter'){
    const v=inp.value;inp.value='';
    if(v.trim()){hist.push(v);hi=hist.length;}
    echo(v);
    if(MODE!=='boot')sfx.blip();
    handle(v);
  }else if(e.key==='ArrowUp'){e.preventDefault();
    if(hi>0){hi--;inp.value=hist[hi]||'';}}
  else if(e.key==='ArrowDown'){e.preventDefault();
    if(hi<hist.length-1){hi++;inp.value=hist[hi];}
    else{hi=hist.length;inp.value='';}}
  else if(e.key==='Tab'){complete(e);}
});
document.addEventListener('click',()=>{if(!window.getSelection().toString())inp.focus();});
addEventListener('beforeunload',save);

const CMDS=['help','ls','cd','map','ps','scan','cat','kill','talk','say','buy','use','equip',
  'inv','stats','quest','save','load','clear','sound','auto','combo','arena','bbs','achv','whoami','pwd'];
function complete(e){
  e.preventDefault();
  const parts=inp.value.split(/\s+/);
  if(parts.length<=1){
    const c=CMDS.filter(x=>x.indexOf(parts[0]||'')===0);
    if(c.length===1)inp.value=c[0]+' ';
    else if(c.length>1)print(c.join('  '),'dim');
    return;}
  const c=parts[0].toLowerCase(),r=parts.slice(1).join(' ');
  const D=DISTRICTS[S.dist];
  let pool=[];
  if(c==='cd')pool=exitsOf(S.dist).map(x=>DISTRICTS[x].name);
  else if(c==='kill'||c==='scan')pool=Object.keys(MOB).map(k=>MOBS[k].name)
    .concat(D.npcs.map(n=>NPCS[n].name));
  else if(c==='cat'&&D.file)pool=[D.file[0]];
  else if(c==='talk'||c==='say')pool=D.npcs.map(n=>NPCS[n].name);
  else if(c==='buy')pool=NPCS.baiYa.shop.map(k=>ITEMS[k].name);
  else if(c==='use'||c==='equip')pool=Object.keys(S.inv).map(k=>ITEMS[k].name);
  if(!pool.length)return;
  const m=pool.filter(x=>x.indexOf(r)===0);
  if(m.length===1)inp.value=c+' '+m[0]+' ';
  else if(m.length>1)print(m.join('  '),'dim');
}

function setName(t){
  if(t==='load'){
    if(load())return;
    print(DIM('请输入新代号,或再试 load。'));return;}
  const nm=t.slice(0,12).replace(/[<>]/g,'').trim();
  if(!nm){print(DIM('代号不能为空。'));return;}
  S=freshState();S.name=nm;
  MODE='intro';renderUI();save();
  intro(nm);
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>NIGHTSHELL ARENA // 夜壳竞技场</title>
<style>
:root{--cyan:#00f0ff;--mag:#ff2ec4;--grn:#39ff88;--red:#ff4757;--amb:#ffc857}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 100% at 50% 115%,rgba(255,46,196,.12),transparent 55%),
  radial-gradient(90% 60% at 80% -10%,rgba(0,240,255,.08),transparent 50%),#04050a;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  font:14px/1.5 Consolas,"Cascadia Code","Microsoft YaHei",monospace;color:#cfe3ee}
#wrap{position:relative;width:min(96vw,1100px)}
canvas{display:block;width:100%;height:auto;background:#05060d;border:1px solid rgba(0,240,255,.25);
  box-shadow:0 0 40px rgba(0,240,255,.12),0 0 120px rgba(255,46,196,.08)}
.scanlines{position:fixed;inset:0;z-index:40;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.20) 0 1px,transparent 1px 3px)}
.vignette{position:fixed;inset:0;z-index:41;pointer-events:none;
  background:radial-gradient(115% 95% at 50% 45%,transparent 62%,rgba(0,0,0,.5))}
.sweep{position:fixed;left:0;right:0;height:100px;z-index:42;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(0,240,255,.05),transparent);
  animation:sw 8s linear infinite}
@keyframes sw{0%{top:-15%}100%{top:110%}}
#hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:#5a7a8c;
  letter-spacing:.12em;z-index:10;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="960" height="540"></canvas></div>
<div class="scanlines"></div><div class="sweep"></div><div class="vignette"></div>
<div id="hint">单人:A/D 移动 · W 跳 · 双击方向 冲刺 · S 格挡 · J 拳 · K 脚 · L 必杀 · P 暂停 &nbsp;|&nbsp; 双人:P1 WASD+F/G/H · P2 方向键+,/./ (或 1/2/3)</div>
<script>
'use strict';
/* ============ 基础 ============ */
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const W=960,H=540,GROUND=452;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const keys={};
let GOD=false;

/* ============ 音效 ============ */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC;}
function tone(f,dur,type,vol,slide){
  dur=dur||.08;type=type||'square';vol=vol||.05;slide=slide||0;
  const a=ac();if(!a)return;
  try{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(28,f+slide),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03);}catch(e){}}
const sfx={
  whoosh:()=>tone(300,.07,'sine',.03,-160),
  hit:()=>{tone(150,.08,'square',.07,-60);tone(90,.11,'sawtooth',.05,-40);},
  block:()=>tone(820,.06,'triangle',.05,-200),
  kick:()=>{tone(120,.12,'sawtooth',.08,-50);},
  special:()=>tone(500,.3,'sawtooth',.06,-380),
  ko:()=>tone(220,.8,'sawtooth',.09,-180),
  jump:()=>tone(340,.09,'sine',.035,220),
  ui:()=>tone(700,.05,'square',.03),
  win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.12,'triangle',.05),i*110));},
};

/* ============ 数据 ============ */
const LADDER=[
 {name:'霓虹帮打手',col:'#ff4757',hp:100,speed:.72,aggr:.55,react:.55,jump:.2,proj:0,scale:1},
 {name:'ICE-巡逻者',col:'#ffc857',hp:112,speed:1.0,aggr:.78,react:.34,jump:.45,proj:.3,scale:1},
 {name:'零号守卫 ROOT/0',col:'#ff2ec4',hp:150,speed:1.08,aggr:.92,react:.2,jump:.55,proj:.42,scale:1.28,armor:1,boss:1},
];
const ATK={
 punch:{startup:.06,active:.10,recover:.16,range:62,dmg:6,kb:170,stun:.30,ly:.5},
 kick:{startup:.15,active:.12,recover:.27,range:84,dmg:11,kb:330,stun:.42,launch:1},
 special:{startup:.22,active:.06,recover:.30,range:0,dmg:0,kb:0,stun:0},
 ult:{startup:.95,active:.08,recover:.42,range:0,dmg:0,kb:0,stun:0},
};
function playerName(){try{const j=JSON.parse(localStorage.getItem('nightshell_save_v1'));return j&&j.name?j.name:'RUNNER';}catch(e){return 'RUNNER';}}

/* ============ 实体 ============ */
/* ============ 可选角色 ============ */
const CHARS=[
 {name:'RUNNER',col:'#00f0ff',hp:100,speed:1,dmgM:1,projR:9,projV:640,scale:1,
  desc:'均衡 · 标准协议'},
 {name:'霓虹帮打手',col:'#ff4757',hp:125,speed:.85,dmgM:1.35,projR:11,projV:560,scale:1.06,
  desc:'力量 · 慢,但每拳都疼'},
 {name:'ICE-巡逻者',col:'#ffc857',hp:90,speed:1.12,dmgM:.9,projR:8,projV:780,scale:1,
  desc:'敏捷 · 高速弹幕'},
 {name:'ROOT/0',col:'#ff2ec4',hp:135,speed:.95,dmgM:1.15,projR:12,projV:600,scale:1.18,armor:1,wave:1,
  desc:'霸体 · 必杀放出格式化波'},
];
let selP=0,selE=0,selTurn=1;

function mkF(brain,col){
 return {brain,col,x:300,y:GROUND,vx:0,vy:0,dir:1,hp:brain.hp,maxhp:brain.hp,meter:0,
  state:'idle',t:0,move:0,wantJump:false,wantAtk:null,blockHeld:false,
  atk:null,hitDone:false,hitstun:0,blockstun:0,onG:true,
  combo:0,comboT:0,dashT:0,lastTapT:-9,lastTapD:0,downT:0,inv:0,
  aiT:0,plan:'approach',scale:brain.scale||1};
}
let P,E,PROJ=[],PARTS=[],roundNo=1,wins=[0,0],timer=60,ladderIdx=0,ULTS=0;
let state='title',stT=0,hitstop=0,shake=0,shakeT=0,ts=1,koBy=-1,flashT=0,matchWin=false;
let mode='ladder'; // ladder | vs
const VS={name:'挑战者 P2',col:'#39ff88',hp:100,speed:1,aggr:0,react:9,jump:0,proj:0,scale:1,vs:1};
function resetFight(keepMeter){
 const pm=P?P.meter:0;
 const pc=CHARS[selP];
 P=mkF({hp:pc.hp,speed:pc.speed,scale:pc.scale,dmgM:pc.dmgM,projR:pc.projR,projV:pc.projV,
   armor:pc.armor,wave:pc.wave,name:pc.name},pc.col);
 P.x=300;P.dir=1;
 if(keepMeter)P.meter=pm;
 if(mode==='vs'){const ec=CHARS[selE];
  E=mkF({hp:ec.hp,speed:ec.speed,scale:ec.scale,dmgM:ec.dmgM,projR:ec.projR,projV:ec.projV,
    armor:ec.armor,wave:ec.wave,name:ec.name},ec.col);}
 else E=mkF(LADDER[ladderIdx],LADDER[ladderIdx].col);
 E.x=660;E.dir=-1;
 PROJ=[];PARTS=[];timer=60;koBy=-1;
}

/* ============ 输入 ============ */
addEventListener('keydown',e=>{
 const k=e.key.length===1?e.key.toLowerCase():e.key;
 if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.key)>=0)e.preventDefault();
 if(!keys[k])press(k);
 keys[k]=true;
});
addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false;});
function press(k){
 if(state==='title'){
  if(k==='1'||k==='Enter'){mode='ladder';sfx.ui();selTurn=1;state='select';stT=0;}
  else if(k==='2'){mode='vs';sfx.ui();selTurn=1;state='select';stT=0;}
 }else if(state==='select'){
  const cur=selTurn===1?selP:selE;
  let nv=cur;
  if(k==='ArrowLeft'||k==='a')nv=(cur+CHARS.length-1)%CHARS.length;
  if(k==='ArrowRight'||k==='d')nv=(cur+1)%CHARS.length;
  if(nv!==cur){sfx.ui();if(selTurn===1)selP=nv;else selE=nv;}
  if(k==='Enter'||k==='j'||k==='f'){sfx.ui();
   if(selTurn===1&&mode==='vs'){selTurn=2;}
   else{ladderIdx=mode==='ladder'?ladderIdx:0;wins=[0,0];roundNo=1;resetFight();state='round';stT=0;}}
 }else if(state==='ladder'&&k==='Enter'){
  sfx.ui();
  if(mode==='vs'){wins=[0,0];roundNo=1;resetFight();state='round';stT=0;return;}
  if(matchWin&&ladderIdx===LADDER.length-1){state='title';stT=0;return;}
  roundNo=1;wins=[0,0];resetFight();state='round';stT=0;
 }
 if(state==='ladder'&&k==='t'){mode='ladder';state='title';stT=0;sfx.ui();}
 if(k==='p'&&(state==='fight'||state==='pause')){
  state=state==='fight'?'pause':'fight';sfx.ui();}
 if(state==='pause'){
  if(k==='r'){roundNo=1;wins=[0,0];resetFight();state='round';stT=0;sfx.ui();}
  if(k==='t'){mode='ladder';state='title';stT=0;sfx.ui();}}
 // 双击方向 = 冲刺
 if(state==='fight'&&P&&!P.atk){
  const now=stT;
  if(k==='d'||(mode==='ladder'&&(k==='ArrowRight'))){
   if(now-(P._rt||-9)<0.28){P.dashT=.16;P.dashDir=1;}
   P._rt=now;}
  if(k==='a'||(mode==='ladder'&&(k==='ArrowLeft'))){
   if(now-(P._lt||-9)<0.28){P.dashT=.16;P.dashDir=-1;}
   P._lt=now;}
  if(mode==='vs'&&E&&!E.atk){
   if(k==='ArrowRight'){if(now-(E._rt||-9)<0.28){E.dashT=.16;E.dashDir=1;}E._rt=now;}
   if(k==='ArrowLeft'){if(now-(E._lt||-9)<0.28){E.dashT=.16;E.dashDir=-1;}E._lt=now;}
  }
 }
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='fight')state='pause';});

/* ============ 战斗逻辑 ============ */
function applyHit(att,def,spec){
 if(hitstop>0)return;
 const a=ATK[spec],armored=def.brain.armor&&def.atk&&!def.hitstun;
 const blocking=def.blockHeld&&def.onG&&!def.atk&&def.hitstun<=0
   &&((def.dir>0&&att.x>def.x)||(def.dir<0&&att.x<def.x));
 if(blocking){
  const d=(def===P&&GOD)?0:Math.max(1,Math.round(a.dmg*.15));
  def.hp-=d;def.blockstun=.16;def.vx=att.dir*a.kb*.4;
  spark(def.x+def.dir*24,def.y-80,'#ffffff',6);sfx.block();
  att.meter=Math.min(100,att.meter+a.dmg*.6);
 }else{
  let dmg=Math.round(a.dmg*(att.brain.dmgM||1));
  if(def===P&&GOD)dmg=0;
  def.hp-=dmg;def.hitstun=armored?a.stun*.4:a.stun;
  def.vx=att.dir*a.kb*(armored?.3:1);
  if(a.launch&&!armored){def.vy=-300;def.onG=false;}
  if(armored){spark(def.x,def.y-90,'#ff2ec4',8);}
  else def.state='hurt',def.t=0,def.atk=null;
  att.combo++;att.comboT=1.3;def.combo=0;
  att.meter=Math.min(100,att.meter+dmg*1.9);
  def.meter=Math.min(100,def.meter+dmg*1.0);
  spark(def.x,def.y-80,att===P?'#00f0ff':'#ff4757',10);
  spark(def.x,def.y-80,'#ffffff',5);
  shakeT=.18;shake=Math.max(shake,a.dmg*.9);
  hitstop=a.dmg>9?.09:.06;
  (spec==='kick'?sfx.kick:sfx.hit)();
  flashT=.08;
 }
}
function updateF(f,foe,dt){
 f.t+=dt;f.inv=Math.max(0,f.inv-dt);f.comboT-=dt;
 if(f.comboT<=0)f.combo=0;
 if(f.state==='ko'){
  f.vy+=2600*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=(1-2.2*dt);
  if(f.y>=GROUND){f.y=GROUND;f.vy=0;f.vx*=.6;}
  f.x=clamp(f.x,50,W-50);return;
 }
 if(f.state==='down'){
  f.downT-=dt;f.vy+=2600*dt;f.y+=f.vy*dt;
  if(f.y>=GROUND){f.y=GROUND;f.vy=0;}
  if(f.downT<=0){f.state='idle';f.inv=.3;}
  return;
 }
 if(f.hitstun>0){
  f.hitstun-=dt;f.vy+=2600*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=(1-4*dt);
  if(f.y>=GROUND){f.y=GROUND;f.vy=0;f.onG=true;
   if(f.state==='hurt'&&(Math.abs(f.vx)>120)){f.state='down';f.downT=.75;f.vx=0;}}
  f.x=clamp(f.x,50,W-50);return;
 }
 f.blockstun=Math.max(0,f.blockstun-dt);
 const spd=330*f.brain.speed;
 // 冲刺
 if(f.dashT>0){f.dashT-=dt;f.vx=f.dashDir*680;}
 else{
  const canMove=!f.atk&&f.blockstun<=0;
  const mv=canMove?f.move:0;
  f.vx=lerp(f.vx,mv*spd*(f.blockHeld?.25:1),1-Math.pow(.0001,dt));
 }
 // 朝向
 if(!f.atk&&f.hitstun<=0)f.dir=foe.x>=f.x?1:-1;
 // 跳
 if(f.wantJump&&f.onG&&!f.atk){f.vy=-880;f.onG=false;sfx.jump();}
 f.wantJump=false;
 // 攻击发起
 if(f.wantAtk&&!f.atk&&f.hitstun<=0&&(!f.blockHeld||!f.onG)){
  if(f.wantAtk==='special'){
   if(f.meter>=100&&f.onG){f.meter=0;f.atk={type:'special',t:0};f.hitDone=false;f.state='attack';sfx.special();}
  }else if(f.wantAtk==='ult'){
   if(f.brain.boss&&f.onG){f.atk={type:'ult',t:0};f.hitDone=false;f.state='attack';sfx.special();}
  }else{
   f.atk={type:f.wantAtk,t:0};f.hitDone=false;f.state='attack';
   sfx.whoosh();
  }
 }
 f.wantAtk=null;
 // 攻击阶段
 if(f.atk){
  const a=ATK[f.atk.type];f.atk.t+=dt;
  if(f.atk.t>=a.startup+a.active+a.recover){f.atk=null;f.state='idle';}
  else if(f.atk.t>=a.startup&&!f.hitDone&&f.atk.t<a.startup+a.active){
   if(f.atk.type==='special'){
    f.hitDone=true;
    const b=f.brain;
    if(b.wave){PROJ.push({x:f.x+f.dir*50,y:GROUND-46,vx:f.dir*430,dir:f.dir,own:f,t:0,
      col:f.col,r:24,wave:1});shakeT=.3;shake=9;}
    else PROJ.push({x:f.x+f.dir*30,y:f.y-84,vx:f.dir*(b.projV||640),dir:f.dir,own:f,t:0,
      col:f.col,r:b.projR||9});
   }else if(f.atk.type==='ult'){
    f.hitDone=true;ULTS++;
    PROJ.push({x:f.x+f.dir*50,y:GROUND-46,vx:f.dir*430,dir:f.dir,own:f,t:0,
      col:'#ff2ec4',r:24,wave:1});
    shakeT=.3;shake=9;
   }else{
    // 判定盒(水平区间 + 纵向活动带)
    const x1=f.x+f.dir*14,x2=f.x+f.dir*(14+a.range);
    const lo=Math.min(x1,x2),hi=Math.max(x1,x2);
    const dlo=foe.x-30*foe.scale,dhi=foe.x+30*foe.scale;
    if(hi>=dlo&&lo<=dhi&&Math.abs(foe.y-f.y)<130*Math.max(f.scale,foe.scale)
      &&foe.state!=='ko'&&foe.inv<=0){
     f.hitDone=true;applyHit(f,foe,f.atk.type);
    }
   }
  }
 }
 // 重力
 f.vy+=2600*dt;
 f.x+=f.vx*dt;f.y+=f.vy*dt;
 if(f.y>=GROUND){if(!f.onG){dust(f.x);}f.y=GROUND;f.vy=0;f.onG=true;}
 f.x=clamp(f.x,50,W-50);
 if(!f.atk&&f.hitstun<=0&&f.blockstun<=0){
  f.state=!f.onG?'jump':(f.blockHeld?'block':(Math.abs(f.vx)>40?'run':'idle'));
 }
 if(f.hp<=0&&f.state!=='ko'){beginKO(f);}
}
function beginKO(f){
 f.state='ko';f.t=0;f.vy=-420;f.vx=(f===P?-1:1)*260;f.hp=0;
 koBy=f===P?1:0;hitstop=.12;shakeT=.4;shake=14;sfx.ko();
 ts=.25;state='ko';stT=0;
 wins[koBy]++;
}
/* ============ AI ============ */
function ai(e,p,dt){
 e.aiT-=dt;e._ultCd=(e._ultCd||0)-dt;
 const dx=p.x-e.x,ad=Math.abs(dx);
 if(e.aiT<=0){
  e.aiT=e.brain.react*rnd(.6,1.4);
  const r=Math.random();
  if(e.brain.boss&&e.hp<e.maxhp*.75&&e._ultCd<=0&&ad<640&&Math.random()<.5){
   e.plan='ult';e._ultCd=10;e.aiT=1.8;return;}
  if(p.atk&&ad<150&&r<.45)e.plan='block';
  else if(p.state==='down'&&ad>90)e.plan='approach';
  else if(ad>390)e.plan=(e.brain.proj&&Math.random()<e.brain.proj)?'proj'
    :(Math.random()<e.brain.jump?'jumpin':'approach');
  else if(ad>120)e.plan=Math.random()<e.brain.jump?'jumpin':'approach';
  else e.plan=r<e.brain.aggr?(Math.random()<.55?'punch':'kick')
    :(r<e.brain.aggr+.2?'block':'retreat');
 }
 e.move=0;e.blockHeld=false;
 switch(e.plan){
  case 'approach':e.move=Math.sign(dx)||1;if(ad<110)e.plan='retreat';break;
  case 'jumpin':e.move=Math.sign(dx)||1;
    if(e.onG&&ad<300&&ad>130)e.wantJump=true;
    if(ad<110)e.plan=Math.random()<.5?'punch':'kick';break;
  case 'block':e.blockHeld=true;break;
  case 'retreat':e.move=-(Math.sign(dx)||1);if(ad>240)e.plan='approach';break;
  case 'punch':case 'kick':e.wantAtk=e.plan;e.plan='approach';break;
  case 'ult':if(!e.atk&&!e.hitstun)e.wantAtk='ult';e.plan='approach';break;
  case 'proj':if(e.meter<100){e.plan='approach';}else{e.wantAtk='special';e.plan='retreat';}break;
 }
}
/* ============ 粒子 ============ */
function spark(x,y,col,n){for(let i=0;i<n;i++)PARTS.push({x,y,vx:rnd(-320,320),vy:rnd(-320,220),
 t:rnd(.15,.4),col});}
function dust(x){for(let i=0;i<5;i++)PARTS.push({x:x+rnd(-14,14),y:GROUND,vx:rnd(-90,90),vy:rnd(-70,-10),
 t:rnd(.2,.4),col:'#2b4a55'});}
/* ============ 主循环 ============ */
let last=performance.now();
function tick(rdt){
 let dt=rdt*ts;
 stT+=rdt;
 shakeT=Math.max(0,shakeT-rdt);flashT=Math.max(0,flashT-rdt);
 if(state==='fight'){
  if(hitstop>0){hitstop-=rdt;}
  else{
   timer=Math.max(0,timer-dt);
   // 玩家输入
   if(mode==='vs'){
    P.move=(keys['d']?1:0)-(keys['a']?1:0);
    P.blockHeld=!!keys['s']&&P.onG;
    if(keys['w'])P.wantJump=true;
    if(keys['f'])P.wantAtk=P.wantAtk||'punch';
    if(keys['g'])P.wantAtk='kick';
    if(keys['h'])P.wantAtk='special';
    E.move=(keys['ArrowRight']?1:0)-(keys['ArrowLeft']?1:0);
    E.blockHeld=!!keys['ArrowDown']&&E.onG;
    if(keys['ArrowUp'])E.wantJump=true;
    if(keys[',']||keys['1'])E.wantAtk=E.wantAtk||'punch';
    if(keys['.']||keys['2'])E.wantAtk='kick';
    if(keys['/']||keys['3'])E.wantAtk='special';
   }else{
    P.move=(keys['ArrowRight']||keys['d']?1:0)-(keys['ArrowLeft']||keys['a']?1:0);
    P.blockHeld=(keys['ArrowDown']||keys['s'])&&P.onG;
    if((keys['ArrowUp']||keys['w']||keys[' ']))P.wantJump=true;
    if(keys['j'])P.wantAtk=P.wantAtk||'punch';
    if(keys['k'])P.wantAtk='kick';
    if(keys['l'])P.wantAtk='special';
    ai(E,P,dt);
   }
   updateF(P,E,dt);updateF(E,P,dt);
   // 身体互推,防穿模
   const minD=34*(P.scale+E.scale)/1,dx2=E.x-P.x;
   if(Math.abs(dx2)<minD&&Math.abs(P.y-E.y)<100){
    const push=(minD-Math.abs(dx2))/2*(dx2>=0?1:-1);
    P.x=clamp(P.x-push,50,W-50);E.x=clamp(E.x+push,50,W-50);
   }
   // 投射物
